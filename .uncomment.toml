[global]
remove_todos = false
remove_fixme = false
remove_docs = true
preserve_patterns = ["HACK", "WORKAROUND", "SPDX-License-Identifier", "betterleaks"]
exclude = []
use_default_ignores = true
respect_gitignore = true
traverse_git_repos = false

[languages.pkl]
name = "Pkl"
extensions = [".pkl"]
comment_nodes = ["comment"]
preserve_patterns = []

[languages.toml]
name = "TOML"
extensions = [".toml"]
comment_nodes = ["comment"]
doc_comment_nodes = []
preserve_patterns = ["tombi"]

[languages.yaml]
name = "YAML"
extensions = [".yaml", ".yml"]
comment_nodes = ["comment"]
doc_comment_nodes = []
preserve_patterns = ["yamllint", "ansible-lint", "$schema"]

[languages.typescript]
name = "TypeScript"
extensions = [".ts", ".tsx", ".mts", ".cts", ".d.ts"]
comment_nodes = ["comment"]
preserve_patterns = ["@ts-expect-error", "@ts-ignore", "oxfmt-", "oxlint-"]

[languages.html]
name = "HTML"
extensions = [".html", ".htm", ".xhtml"]
comment_nodes = ["comment"]

[languages.css]
name = "CSS"
extensions = [".css"]
comment_nodes = ["comment"]

[languages.javascript]
name = "JavaScript"
extensions = [".js", ".jsx", ".mjs", ".cjs"]
comment_nodes = ["comment"]
preserve_patterns = ["@ts-expect-error", "@ts-ignore", "oxfmt-", "oxlint-"]

[languages.astro]
name = "Svelte"
extensions = [".astro"]
comment_nodes = ["comment"]
preserve_patterns = ["oxfmt-", "oxlint-"]

[languages.svelte]
name = "Svelte"
extensions = [".svelte"]
comment_nodes = ["comment"]
preserve_patterns = ["oxfmt-", "oxlint-"]

[patterns."tests/**/*"]
remove_todos = true

[patterns."**/*.spec.*"]
remove_docs = true
remove_todos = true

[patterns."**/*.generated.*"]
remove_docs = true
remove_todos = true
preserve_patterns = []
