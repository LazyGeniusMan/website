---
packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  astro: ^7.4.0
  "@astrojs/check": ^0.9.10
  "@astrojs/svelte": ^9.1.0
  svelte: ^5.57.2
  svelte-check: ^4.7.7
  "@sveltejs/vite-plugin-svelte": ^7.3.1
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  tw-animate-css: ^1.4.0
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  tailwind-variants: ^3.3.1
  bits-ui: ^2.19.5
  "@internationalized/date": ^3.12.4
  "@lucide/svelte": ^1.59.0
  mode-watcher: ^1.1.0
  nanostores: ^1.5.5
  svelte-sonner: ^1.2.1
  cf: 1.0.0-beta.18
  sharp: ^0.35.5
  schema-dts: 2.0.0
  ajv: ^8.20.0
  ajv-formats: ^3.0.1
  node-html-parser: ^9.0.4
  vitest: ^5.0.5
  shadcn-svelte: ^1.7.0
  vaul-svelte: 1.0.0-next.7
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
